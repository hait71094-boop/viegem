<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MythicSurvival - Đang bảo trì | VIEGEM</title>
    <meta name="description" content="MythicSurvival trên VIEGEM đang bảo trì. Quay lại sau!">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/png" href="../images/server-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #d9534f; --black: #1a1a1a; --white: #f5f5f5; --gray-text: #b0b0b0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            background: #111;
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 50% 30%, rgba(217, 83, 79, 0.08) 0%, transparent 50%);
        }
        .logo-img { width: 100px; height: 100px; margin-bottom: 24px; object-fit: contain; }
        h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 16px; color: var(--gray-text); }
        p { color: var(--gray-text); font-size: 1.1rem; max-width: 420px; margin-bottom: 36px; line-height: 1.7; }
        .badge {
            display: inline-block; padding: 6px 16px;
            background: rgba(136,136,136,0.15); border: 1px solid rgba(136,136,136,0.35);
            border-radius: 50px; color: #aaa; font-size: 0.85rem; font-weight: 600;
            margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #d9534f, #c9302c);
            color: white; border: none; border-radius: 8px; font-weight: 600;
            font-size: 1rem; text-decoration: none; transition: all 0.3s ease;
            font-family: inherit; box-shadow: 0 4px 15px rgba(217, 83, 79, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(217, 83, 79, 0.45); }
    </style>
</head>
<body>
    <img src="../images/logo.webp" alt="VIEGEM" class="logo-img">
    <div class="badge">Đang bảo trì</div>
    <h1>MythicSurvival</h1>
    <p>Cụm máy chủ này hiện đang bảo trì hoặc sắp ra mắt. Vui lòng quay lại sau!</p>
    <a href="../index.html" class="btn">← Quay lại trang chủ</a>
</body>
</html>
